<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Warehouse Storage System
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <!-- ==================================================
         HEADER
    =================================================== -->

    <header class="header">

        WAREHOUSE STORAGE SYSTEM

    </header>


    <!-- ==================================================
         MODE BAR
    =================================================== -->

    <div
        id="modeBar"
        class="mode-bar in-mode"
    >

        IN / STORE MODE

    </div>


    <!-- ==================================================
         MAIN
    =================================================== -->

    <main class="main-container">


        <!-- ==============================================
             LEFT SIDE
        =============================================== -->

        <section class="operation-panel">


            <div
                id="statusText"
                class="status-text"
            >

                READY TO STORE

            </div>


            <div class="section-label">

                PRODUCT

            </div>


            <div
                id="productText"
                class="product-text"
            >

                ---

            </div>


            <div class="section-label">

                LOCATION

            </div>


            <div
                id="locationText"
                class="location-text"
            >

                Scan product to store

            </div>


            <!-- BARCODE -->

            <div class="scanner-container">

                <label for="barcodeInput">

                    SCAN BARCODE

                </label>


                <input
                    id="barcodeInput"
                    type="text"
                    autocomplete="off"
                    autofocus
                >

            </div>


            <!-- SHORTCUTS -->

            <div class="shortcut-help">

                <span>
                    F1 = STORE / IN
                </span>

                <span>
                    F2 = TAKE / OUT
                </span>

            </div>


        </section>


        <!-- ==============================================
             STORAGE TABLE
        =============================================== -->

        <section class="storage-panel">


            <h2>

                STORAGE STATUS

            </h2>


            <table id="storageTable">


                <thead>

                    <tr>

                        <th>
                            LANE
                        </th>

                        <th>
                            SLOT A
                        </th>

                        <th>
                            SLOT B
                        </th>

                    </tr>

                </thead>


                <tbody id="storageBody">

                </tbody>


            </table>


            <div
                id="capacityText"
                class="capacity"
            >

                OCCUPIED : 0/34
                &nbsp;&nbsp;
                AVAILABLE : 34

            </div>


        </section>


    </main>


    <!-- ==================================================
         FOOTER
    =================================================== -->

    <footer class="footer">

        <span>
            Barcode Scanner Ready
        </span>

        <span>|</span>

        <span>
            F1: Store
        </span>

        <span>|</span>

        <span>
            F2: Take
        </span>

        <span>|</span>

        <span>
            F11: Fullscreen
        </span>

    </footer>


    <script
        src="{{ url_for('static', filename='app.js') }}"
    ></script>


</body>

</html>
